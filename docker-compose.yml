services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dsa-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsa_forge
      POSTGRES_USER: dsa_forge
      POSTGRES_PASSWORD: dsa_forge_dev
    ports:
      - "5432:5432"
    volumes:
      - dsa_forge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa_forge -d dsa_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dsa_forge_postgres_data:
